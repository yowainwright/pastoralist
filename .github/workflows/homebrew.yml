name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pastoralist-binary-release
  cancel-in-progress: false

jobs:
  preflight:
    uses: yowainwright/homebrew-tap/.github/workflows/publish-formula.yml@c175e0ca1e20631c6d04ee2d690c6d6b626c5dee
    with:
      package: pastoralist
      tag: ${{ inputs.version }}
      preflight_only: true
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  build-binaries:
    needs: preflight
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-amd64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ inputs.version }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Setup Node.js
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build and test ScriptC binary
        id: perry
        run: |
          pnpm run test:e2e:binary
          BINARY="pastoralist-${{ matrix.target }}"
          cp artifacts/pastoralist "$BINARY"
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Attest ScriptC binary
        id: perry-attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ steps.perry.outputs.binary }}

      - name: Prepare binary attestation
        id: perry-attestation
        env:
          BINARY: ${{ steps.perry.outputs.binary }}
          BUNDLE_PATH: ${{ steps.perry-attest.outputs.bundle-path }}
        run: |
          SIGSTORE_BUNDLE="${BINARY}.sigstore.json"
          cp "$BUNDLE_PATH" "$SIGSTORE_BUNDLE"
          echo "sigstore_bundle=$SIGSTORE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload binary assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-${{ matrix.target }}
          path: |
            ${{ steps.perry.outputs.binary }}
            ${{ steps.perry-attestation.outputs.sigstore_bundle }}

  publish-binaries:
    needs: build-binaries
    runs-on: macos-latest
    environment: homebrew-publish
    permissions:
      contents: write
    env:
      RELEASE_REF: "${{ inputs.version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ inputs.version }}"

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: release-tools
          persist-credentials: false
          ref: "${{ github.workflow_sha }}"
          sparse-checkout: scripts/release/upload-assets.sh
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Setup Node.js
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate stable version
        run: |
          export VERSION="${RELEASE_REF#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pnpm exec jiti scripts/release/brew.ts validate-version

      - name: Download binary assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: homebrew-*
          merge-multiple: true

      - name: Attach binaries to GitHub release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_SCRIPT="release-tools/scripts/release/upload-assets.sh"
          RELEASE_TAG="v${VERSION}"
          BINARY_ASSETS=()
          while IFS= read -r asset; do
            BINARY_ASSETS+=("$asset")
          done < <(find . -maxdepth 1 -type f \( -name 'pastoralist-darwin-*' -o -name 'pastoralist-linux-*' \) | sort)
          test "${#BINARY_ASSETS[@]}" -eq 8
          RELEASE_ID="$(sh "$RELEASE_SCRIPT" "$RELEASE_TAG" "${BINARY_ASSETS[@]}")"
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api --method PATCH "$RELEASE_ENDPOINT" -F draft=false --silent

  homebrew:
    needs: publish-binaries
    uses: yowainwright/homebrew-tap/.github/workflows/publish-formula.yml@c175e0ca1e20631c6d04ee2d690c6d6b626c5dee
    with:
      package: pastoralist
      tag: ${{ inputs.version }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
