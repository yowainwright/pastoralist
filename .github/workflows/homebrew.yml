name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-pastoralist
  cancel-in-progress: false

jobs:
  build-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-amd64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ inputs.version }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Setup Node.js
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build and test ScriptC binary
        id: perry
        run: |
          pnpm run test:e2e:binary
          BINARY="pastoralist-${{ matrix.target }}"
          cp artifacts/pastoralist "$BINARY"
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Attest ScriptC binary
        id: perry-attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ steps.perry.outputs.binary }}

      - name: Prepare binary attestation
        id: perry-attestation
        env:
          BINARY: ${{ steps.perry.outputs.binary }}
          BUNDLE_PATH: ${{ steps.perry-attest.outputs.bundle-path }}
        run: |
          SIGSTORE_BUNDLE="${BINARY}.sigstore.json"
          cp "$BUNDLE_PATH" "$SIGSTORE_BUNDLE"
          echo "sigstore_bundle=$SIGSTORE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload binary assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-${{ matrix.target }}
          path: |
            ${{ steps.perry.outputs.binary }}
            ${{ steps.perry-attestation.outputs.sigstore_bundle }}

  homebrew:
    needs: build-binaries
    runs-on: macos-latest
    environment: homebrew-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FORMULA_PATH: pastoralist.rb
      RELEASE_REF: "${{ inputs.version }}"
      TAP_NAME: pastoralist/release-test

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ inputs.version }}"

      - name: Checkout release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: release-tools
          persist-credentials: false
          ref: "${{ github.workflow_sha }}"
          sparse-checkout: scripts/release/upload-assets.sh
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Setup Node.js
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate stable version
        run: |
          export VERSION="${RELEASE_REF#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pnpm exec jiti scripts/release/brew.ts validate-version

      - name: Wait for npm package availability
        run: |
          for _ in {1..30}; do
            if npm view "pastoralist@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Download binary assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: homebrew-*
          merge-multiple: true

      - name: Generate formula from published tarball
        run: pnpm exec jiti scripts/release/brew.ts generate

      - name: Create formula test tap
        run: |
          brew tap-new --no-git "$TAP_NAME"
          TAP_PATH="$(brew --repository "$TAP_NAME")"
          cp "$FORMULA_PATH" "$TAP_PATH/Formula/pastoralist.rb"

      - name: Install and test formula
        run: |
          brew audit --new --formula "$TAP_NAME/pastoralist"
          brew audit --strict --online "$TAP_NAME/pastoralist"
          brew install --build-from-source "$TAP_NAME/pastoralist"
          brew test "$TAP_NAME/pastoralist"
          pastoralist --help
          pastoralist --version

      - name: Attach formula to GitHub release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_SCRIPT="release-tools/scripts/release/upload-assets.sh"
          RELEASE_TAG="v${VERSION}"
          BINARY_ASSETS=()
          while IFS= read -r asset; do
            BINARY_ASSETS+=("$asset")
          done < <(find . -maxdepth 1 -type f \( -name 'pastoralist-darwin-*' -o -name 'pastoralist-linux-*' \) | sort)
          test "${#BINARY_ASSETS[@]}" -eq 8
          RELEASE_ASSETS=("$FORMULA_PATH" "${BINARY_ASSETS[@]}")
          RELEASE_ID="$(sh "$RELEASE_SCRIPT" "$RELEASE_TAG" "${RELEASE_ASSETS[@]}")"
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Update Homebrew tap
        env:
          GH_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
          TAP_BRANCH: "pastoralist-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          gh auth setup-git --hostname github.com --force
          gh repo clone yowainwright/homebrew-tap tap
          cd tap
          git switch -c "$TAP_BRANCH"
          cp "../$FORMULA_PATH" Formula/pastoralist.rb
          git add Formula/pastoralist.rb
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "pastoralist $VERSION"
          git push --set-upstream origin "$TAP_BRANCH"
          gh pr create --base main --head "$TAP_BRANCH" --title "pastoralist $VERSION" --body "Automated formula update for pastoralist $VERSION."

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api --method PATCH "$RELEASE_ENDPOINT" -F draft=false --silent
