name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Apply test bootstrap exceptions
        run: |
          jq '
            def is_test_bootstrap:
              .ruleId == "PinnedDependenciesID"
              and (.message.text // "" | test("^score is [0-9]+: npmCommand not pinned by hash\n"))
              and (.locations | length == 1)
              and (.locations[0].physicalLocation.artifactLocation.uri as $path
                | [
                    "tests/e2e/Dockerfile",
                    "tests/e2e/Dockerfile.pnpm-yaml",
                    "tests/e2e/Dockerfile.yarn"
                  ] | index($path) != null);
            .runs |= map(
              if .tool.driver.name == "Scorecard" then
                .results |= map(select(is_test_bootstrap | not))
              else . end
            )
          ' scorecard.sarif > scorecard-filtered.sarif

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: scorecard-filtered.sarif
