name: Test Published Release
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published pastoralist version to test (leave empty for latest on npm)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-published-release:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: "${{ github.workflow_sha }}"

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Determine Version to Test
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          VERSION="${INPUT_VERSION:-$RELEASE_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view pastoralist version)
          fi
          VERSION="${VERSION#v}"
          SEMVER_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing pastoralist version: $VERSION"

      - name: Wait for NPM Package Availability
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Waiting for pastoralist@$VERSION to be available on npm..."
          for i in {1..30}; do
            if npm view "pastoralist@$VERSION" version >/dev/null 2>&1; then
              echo "Package pastoralist@$VERSION is available on npm"
              exit 0
            fi
            echo "⏳ Attempt $i/30: Package not yet available, waiting 30 seconds..."
            sleep 30
          done
          echo "Package pastoralist@$VERSION did not become available" >&2
          exit 1

      - name: Build Test Docker Image
        env:
          PASTORALIST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > Dockerfile.release-test << 'EOF'
          ARG NODE_VERSION=26
          ARG NODE_VARIANT=alpine
          ARG NODE_DIGEST=sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019
          FROM node:${NODE_VERSION}-${NODE_VARIANT}@${NODE_DIGEST}

          # Install bash and pnpm
          RUN apk add --no-cache bash jq git
          RUN npm install --global pnpm@10.25.0

          WORKDIR /app

          # Install the specific version of pastoralist from npm
          ARG PASTORALIST_VERSION
          RUN npm install --global "pastoralist@${PASTORALIST_VERSION}" && \
              ln -s "$(npm root --global)/pastoralist/dist" /app/pastoralist && \
              ln -s "$(npm root --global)/pastoralist" /app/pastoralist-package

          # Set up test environment
          RUN mkdir -p packages/app packages/utils packages/shared e2e/fixtures/patches

          # Copy test fixtures and scripts
          COPY tests/e2e/fixtures/ ./e2e/fixtures/
          COPY tests/e2e/scripts/ ./scripts/

          # Copy workspace configurations
          COPY tests/e2e/fixtures/root-package.json ./package.json
          COPY tests/e2e/fixtures/root-pnpm-lock.yaml ./pnpm-lock.yaml
          COPY tests/e2e/fixtures/root-pnpm-workspace.yaml ./pnpm-workspace.yaml
          COPY tests/e2e/fixtures/app-package.json ./packages/app/package.json
          COPY tests/e2e/fixtures/utils-package.json ./packages/utils/package.json
          COPY tests/e2e/fixtures/shared-package.json ./packages/shared/package.json

          # Create dummy source files
          RUN echo 'console.log("App module");' > ./packages/app/index.js && \
              echo 'console.log("Utils module");' > ./packages/utils/index.js && \
              echo 'console.log("Shared module");' > ./packages/shared/index.js

          # Install dependencies and prepare scripts
          RUN pnpm install --frozen-lockfile && rm ./pnpm-workspace.yaml && chmod +x ./scripts/*.sh

          CMD ["/bin/sh"]
          EOF

          docker build \
            --build-arg PASTORALIST_VERSION="$PASTORALIST_VERSION" \
            -f Dockerfile.release-test \
            -t pastoralist-release-test .

      - name: Verify Installation
        run: |
          echo "🔍 Verifying pastoralist installation..."
          docker run --rm pastoralist-release-test bash -euc "
            pastoralist --help
            echo 'Installation verified ✅'
          "

      - name: Run Full E2E Test Suite
        run: |
          echo "🧪 Running full e2e test suite with published package..."
          docker run --rm pastoralist-release-test bash -euc "
            echo '🏃‍♂️ Running workspace e2e tests...'
            ./scripts/run-e2e-tests.sh

            echo '📦 Running single package tests...'
            ./scripts/test-single-packages.sh

            echo '✅ All tests completed successfully!'
          "

      - name: Test with Different Package Managers
        env:
          PASTORALIST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "🔧 Testing with different package managers..."

          # Test with npm
          cat > Dockerfile.npm-test << 'EOF'
          ARG NODE_VERSION=26
          ARG NODE_VARIANT=alpine
          ARG NODE_DIGEST=sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019
          FROM node:${NODE_VERSION}-${NODE_VARIANT}@${NODE_DIGEST}
          RUN apk add --no-cache bash jq git
          WORKDIR /app
          ARG PASTORALIST_VERSION
          RUN npm install --global "pastoralist@${PASTORALIST_VERSION}" && \
              ln -s "$(npm root --global)/pastoralist/dist" /app/pastoralist && \
              ln -s "$(npm root --global)/pastoralist" /app/pastoralist-package
          COPY tests/e2e/fixtures/ ./e2e/fixtures/
          COPY tests/e2e/scripts/ ./scripts/
          COPY tests/e2e/fixtures/npm-root-package.json ./package.json
          COPY tests/e2e/fixtures/npm-root-package-lock.json ./package-lock.json
          COPY tests/e2e/fixtures/app-package.json ./packages/app/package.json
          COPY tests/e2e/fixtures/utils-package.json ./packages/utils/package.json
          COPY tests/e2e/fixtures/shared-package.json ./packages/shared/package.json
          RUN mkdir -p packages/app packages/utils packages/shared && \
              echo 'console.log("test");' > ./packages/app/index.js && \
              echo 'console.log("test");' > ./packages/utils/index.js && \
              echo 'console.log("test");' > ./packages/shared/index.js && \
              npm ci && chmod +x ./scripts/*.sh
          EOF

          docker build \
            --build-arg PASTORALIST_VERSION="$PASTORALIST_VERSION" \
            -f Dockerfile.npm-test \
            -t pastoralist-npm-test .

          docker run --rm pastoralist-npm-test bash -euc "
            ./scripts/run-e2e-tests.sh
            echo '✅ NPM workspace test passed'
          "

      - name: Performance and Compatibility Check
        run: |
          echo "⚡ Running performance and compatibility checks..."
          docker run --rm pastoralist-release-test bash -euc "
            echo '🕐 Testing command execution time...'
            time pastoralist --help >/dev/null

            echo '📋 Testing with debug output...'
            pastoralist --debug --isTestingCLI

            echo '🔍 Testing with various options...'
            pastoralist --path package.json --debug --isTestingCLI

            echo '✅ Performance and compatibility checks passed'
          "

      - name: Report Test Results
        run: |
          echo "📊 Test Summary"
          echo "==============="
          echo "✅ Tested pastoralist version: ${{ steps.version.outputs.version }}"
          echo "✅ Full e2e test suite: PASSED"
          echo "✅ Single package tests: PASSED"
          echo "✅ Multi package manager tests: PASSED"
          echo "✅ Performance checks: PASSED"
          echo ""
          echo "🎉 Published package is working correctly!"
          echo "📦 Ready for production use"

      - name: Trigger External E2E Tests
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_URL: ${{ github.event.release.html_url || github.event.workflow_run.html_url }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TRIGGER_TYPE: ${{ github.event_name }}
        with:
          github-token: ${{ secrets.PASTORALIST_TEST_DISPATCH_TOKEN }}
          script: |
            console.log('🚀 Triggering external e2e tests in pastoralist-test repository');

            const releaseUrl = process.env.RELEASE_URL || 'Manual trigger';

            await github.rest.repos.createDispatchEvent({
              owner: 'yowainwright',
              repo: 'pastoralist-test',
              event_type: 'pastoralist-release',
              client_payload: {
                version: process.env.RELEASE_VERSION,
                release_url: releaseUrl,
                trigger_type: process.env.TRIGGER_TYPE
              }
            });

            console.log(`✅ Successfully triggered external tests for version ${process.env.RELEASE_VERSION}`);

      - name: Create Test Report
        if: always()
        env:
          RELEASE_TEST_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TEST_STATUS: ${{ job.status }}
        run: |
          cat > test-report.md << EOF
          # Pastoralist Release Test Report

          **Version Tested:** $RELEASE_TEST_VERSION
          **Test Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Status:** $RELEASE_TEST_STATUS
          EOF

          echo "📄 Test report created:"
          cat test-report.md
