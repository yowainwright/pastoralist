coverage:
  precision: 2
  round: down
  range: 90...100
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%
  ignore:
    - "src/types.ts"
    - "src/**/types.ts"
    - "src/constants.ts"
    - "src/**/constants.ts"
    - "tools/**/types.ts"
    - "tools/**/constants.js"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

github_checks:
  annotations: true
