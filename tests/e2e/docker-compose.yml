services:
  e2e-js-mgrs:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.js-mgrs

  e2e-sveltekit2:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.sveltekit2

  e2e-n8n:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.n8n

  e2e-pnpm-yaml:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.pnpm-yaml
    environment:
      - NODE_ENV=test
      - IS_DEBUGGING=false

  e2e-external-config:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.external-config
    environment:
      - NODE_ENV=test
      - IS_DEBUGGING=false

  # Test with pnpm
  e2e-pnpm:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    container_name: pastoralist-e2e-pnpm
    volumes:
      - ../../dist:/app/pastoralist:ro
      - ../../scripts/setup:/app/scripts/setup:ro
      - ../../skills:/app/skills:ro
      - ../../scripts/setup:/app/pastoralist-package/scripts/setup:ro
      - ../../skills:/app/pastoralist-package/skills:ro
      - ./results:/app/results
    working_dir: /app
    command: /app/scripts/run-e2e-tests.sh
    environment:
      - NODE_ENV=test
      - IS_DEBUGGING=true
      - PACKAGE_MANAGER=pnpm

  # Interactive shell for manual testing
  e2e-shell:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.js-mgrs
    volumes:
      - ../../dist:/app/pastoralist:ro
      - ../../package.json:/app/package.json:ro
      - ../../scripts/setup:/app/scripts/setup:ro
      - ../../skills:/app/skills:ro
      - ../../scripts/setup:/app/pastoralist-package/scripts/setup:ro
      - ../../skills:/app/pastoralist-package/skills:ro
      - ./results:/app/results
      - e2e-downloads:/cache
    working_dir: /app/e2e/interactive
    command: ["bash", "/app/tests/interactive.sh"]
    stdin_open: true
    tty: true
    environment:
      PACKAGE_MANAGER: ${PACKAGE_MANAGER:-pnpm}
      E2E_SCENARIO: ${E2E_SCENARIO:-overrides}
      IS_DEBUGGING: "false"
      npm_config_cache: /cache/npm
      BUN_INSTALL_CACHE_DIR: /cache/bun

  # Test with npm
  e2e-npm:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.npm
    container_name: pastoralist-e2e-npm
    volumes:
      - ../../dist:/app/pastoralist:ro
      - ../../scripts/setup:/app/scripts/setup:ro
      - ../../skills:/app/skills:ro
      - ../../scripts/setup:/app/pastoralist-package/scripts/setup:ro
      - ../../skills:/app/pastoralist-package/skills:ro
      - ./results:/app/results
    working_dir: /app
    command: /app/scripts/run-e2e-tests.sh
    environment:
      - NODE_ENV=test
      - IS_DEBUGGING=true
      - PACKAGE_MANAGER=npm

  # Test with yarn
  e2e-yarn:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.yarn
    container_name: pastoralist-e2e-yarn
    volumes:
      - ../../dist:/app/pastoralist:ro
      - ../../scripts/setup:/app/scripts/setup:ro
      - ../../skills:/app/skills:ro
      - ../../scripts/setup:/app/pastoralist-package/scripts/setup:ro
      - ../../skills:/app/pastoralist-package/skills:ro
      - ./results:/app/results
    working_dir: /app
    command: /app/scripts/run-e2e-tests.sh
    environment:
      - NODE_ENV=test
      - IS_DEBUGGING=true
      - PACKAGE_MANAGER=yarn

volumes:
  e2e-downloads:
